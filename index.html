<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaPS | Camera Node</title>
</head>
<body>
    <h1>TaPS Camera Node</h1>
    <button style="background-color: green; padding: 1rem; font-size: 1.5em; font-weight: bold;" onclick="fetch('/recording',{method:'POST',body:JSON.stringify({'action': 'start'})})">Start</button>
    <button style="background-color: red; padding: 1rem; font-size: 1.5em; font-weight: bold;" onclick="fetch('/recording',{method:'POST',body:JSON.stringify({'action': 'stop'})})">Stop</button>
</body>
</html>
