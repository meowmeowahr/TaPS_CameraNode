<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaPS | Camera Node</title>
    <script>
        function refreshDisk() {
            fetch('/disk')
                .then(response => response.json())
                .then(data => {
                    const div = document.getElementById('disk-info');
                    if (data.error) {
                        div.textContent = 'Error: ' + data.error;
                    } else {
                        div.innerHTML = `
                            <p>Path: ${data.path}</p>
                            <p>Total: ${(data.total_bytes / (1024*1024)).toFixed(2)} MB</p>
                            <p>Used: ${(data.used_bytes / (1024*1024)).toFixed(2)} MB</p>
                            <p>Free: ${(data.free_bytes / (1024*1024)).toFixed(2)} MB</p>
                            <p>Used Percent: ${data.used_percent.toFixed(2)}%</p>
                        `;
                    }
                })
                .catch(err => {
                    document.getElementById('disk-info').textContent = 'Error fetching disk info: ' + err;
                });
        }
        // Optionally load on page load
        window.onload = refreshDisk;
    </script>
</head>
<body>
    <h1>TaPS Camera Node</h1>
    <button style="background-color: green; padding: 1rem; font-size: 1.5em; font-weight: bold;" onclick="fetch('/recording',{method:'POST',body:JSON.stringify({'action': 'start'})})">Start</button>
    <button style="background-color: red; padding: 1rem; font-size: 1.5em; font-weight: bold;" onclick="fetch('/recording',{method:'POST',body:JSON.stringify({'action': 'stop'})})">Stop</button>
    <div id="disk-info">
        Loading disk info...
    </div>
    <button onclick="refreshDisk()">Refresh Disk Info</button>
    <img src="/stream" width="400" alt="Stream">
</body>
</html>
